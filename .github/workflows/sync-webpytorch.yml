name: Sync WebPyTorch runtime

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-webpytorch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout skill repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Checkout WebPyTorch upstream
        uses: actions/checkout@v4
        with:
          repository: xnetsc/webpytorch
          ref: main
          path: _webpytorch
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync tracked WebPyTorch dependencies
        run: node scripts/sync-webpytorch.mjs --upstream "$GITHUB_WORKSPACE/_webpytorch"

      - name: Verify without model payloads
        run: npm run test:ci

      - name: Commit dependency changes
        run: |
          if git diff --quiet -- skills/laya-browser-use/runtime/webtorch; then
            echo 'WebPyTorch dependency files are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/laya-browser-use/runtime/webtorch
          git commit -m "Sync WebPyTorch runtime"
          git push origin HEAD:main
