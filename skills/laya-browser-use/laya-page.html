<!doctype html>
<meta charset="utf-8">
<title>Local Laya decision runtime</title>
<pre id="status">booting…</pre>
<script src="/dist/wgpy-main.js"></script>
<script src="/webtorch/js/webtorch-main.js"></script>
<script>
const params = new URLSearchParams(location.search);
const PYODIDE_INDEX_URL = params.get('pyodide') || undefined;
const DEFER_MODEL_LOAD = params.get('deferModel') === '1';
const runtime = { ready: false, error: '', model: '', backend: '', status: '' };
const report = (value) => {
  runtime.status = String(value);
  document.getElementById('status').textContent = runtime.status;
};

if (webtorch.onError) webtorch.onError((error) => {
  runtime.error = String((error && error.message) || error);
  report('failed: ' + runtime.error);
});

(async () => {
  try {
    const modelManifest = await fetch('/model-manifest.json', {cache: 'no-store'}).then((response) => {
      if (!response.ok) throw new Error('model manifest HTTP ' + response.status);
      return response.json();
    });
    runtime.model = String(modelManifest.model || '');
    if (!runtime.model) throw new Error('model manifest has no model identifier');
    // Where the files are served is the server's to say, not this page's to spell: the
    // checkpoint lives in a directory that is found rather than named.
    const modelMount = String(modelManifest.mount || '');
    if (!modelMount) throw new Error('model manifest has no mount path');
    const wt = await webtorch.start({
      baseURL: '/',
      pyodideIndexURL: PYODIDE_INDEX_URL,
      onStatus: report,
    });
    runtime.backend = String(wt.backend || (wt.stats && wt.stats().backend) || '');
    await wt.run('import webtorch\nwebtorch.use_default_io()');
    const cacheInfo = async () => JSON.parse(await wt.run(
      'import json, webtorch\njson.dumps(await webtorch.list_cache())',
    ));
    const readCached = async (name, offset, length) => {
      const data = await wt.run(
        'import webtorch\nawait webtorch.read_cache(__cache_name, __cache_offset, __cache_length)',
        {__cache_name: name, __cache_offset: offset, __cache_length: length},
      );
      if (data == null) return null;
      const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode(...bytes.subarray(i, Math.min(bytes.length, i + 0x8000)));
      }
      return btoa(binary);
    };
    runtime.cache = await cacheInfo();
    runtime.ioReady = true;
    window.__laya = {
      status: () => ({ ...runtime }),
      cacheInfo,
      readCached,
      load: async () => {
        const info = await wt.load(modelMount, {
          onProgress: (progress) => report('read ' + Math.round((progress.bytes || 0) / 1048576) + ' MB'),
          onStage: (stage) => report(String(stage.stage || stage)),
        });
        runtime.surface = (info && info.surface) || null;
        runtime.ready = true;
        report('ready: ' + runtime.model + (runtime.backend ? ' on ' + runtime.backend : ''));
        return runtime;
      },
      decide: (request) => wt.decide(request.state, request.questions),
    };
    if (!DEFER_MODEL_LOAD) await window.__laya.load();
  } catch (error) {
    runtime.error = String((error && error.stack) || error);
    report('failed: ' + runtime.error);
    window.__laya = { status: () => ({ ...runtime }) };
  }
})();
</script>
